name: Backend tests

# Déclencheurs : à chaque push (sur n'importe quelle branche) et à chaque
# pull request ciblant main. Retire la partie "push" si tu ne veux le
# lancer que sur les PR.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Toutes les commandes ci-dessous s'exécutent depuis backend/, où vivent
    # package.json / pnpm-lock.yaml / hardhat.config.ts.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler les contrats
        run: pnpm hardhat compile

      - name: Lancer les tests
        run: pnpm hardhat test mocha
